<!DOCTYPE html><html lang="zh-Hant"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>政治新聞｜2026-08-12</title><style>
  :root { --bg:#f5f6f8; --card:#ffffff; --txt:#1a2230; --sub:#5b6675; --line:#e2e6eb;
          --fin:#1a73e8; --pol:#7a3e9d; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--txt);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang TC","Microsoft JhengHei",sans-serif;
    line-height:1.8; -webkit-text-size-adjust:100%; font-size:22px; }
  .wrap { max-width:900px; margin:0 auto; padding:20px; }
  header { text-align:center; padding:24px 0 10px; border-bottom:1px solid var(--line); }
  header h1 { margin:0; font-size:2.2rem; }
  header .stamp { color:var(--sub); font-size:1.1rem; margin-top:6px; }
  .cat { background:var(--card); border:1px solid var(--line); border-radius:14px;
    padding:22px; margin:22px 0; }
  .cat h2 { margin:0 0 6px; font-size:1.7rem; }
  .cat.fin h2 { color:var(--fin); }
  .cat.pol h2 { color:var(--pol); }
  .cat .hint { color:var(--sub); font-size:1.05rem; margin:0 0 14px; }
  .dates { display:flex; flex-wrap:wrap; gap:10px; }
  .dates a { display:inline-block; text-decoration:none; font-weight:600; font-size:1.05rem;
    padding:10px 16px; border-radius:10px; color:#fff; }
  .cat.fin .dates a { background:var(--fin); }
  .cat.pol .dates a { background:var(--pol); }
  .dates a:hover { opacity:.85; }
  .back { text-align:center; margin:10px 0; }
  .back a { color:var(--sub); text-decoration:none; font-weight:600; }
  footer { text-align:center; color:var(--sub); font-size:1rem; padding:24px 0; border-top:1px solid var(--line); }
  @media (max-width:480px) { .wrap{padding:14px;} body{font-size:20px;} header h1{font-size:1.8rem;} }

ol.news{margin:0;padding-left:0;list-style:none;counter-reset:n;}
ol.news li{padding:14px 0;border-bottom:1px solid var(--line);}
ol.news li:last-child{border-bottom:none;}
ol.news li .title{font-size:1.3rem;font-weight:700;line-height:1.5;}
ol.news li .desc{font-size:1.12rem;margin:4px 0;}
ol.news li .meta{color:var(--sub);font-size:1rem;}
</style></head><body><div class="wrap">
<header><h1>🌐 政治新聞｜2026-08-12</h1>

</div></body></html>
