  .back a { color:var(--sub); text-decoration:none; font-weight:600; }
  footer { text-align:center; color:var(--sub); font-size:1rem; padding:24px 0; border-top:1px solid var(--line); }
  @media (max-width:480px) { .wrap{padding:14px;} body{font-size:20px;} header h1{font-size:1.8rem;} }
